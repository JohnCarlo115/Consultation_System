<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management | Consultation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">C</span><div><strong>Consultation</strong><small>Admin</small></div></div>
    <nav>
      <a href="#">Dashboard</a>
      <a href="#" class="active">Student Management</a>
      <a href="#">Consultations</a>
      <a href="#">Schedule</a>
      <a href="#">Counselors</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
    <a href="#" class="logout">Logout</a>
  </aside>
 
  <main class="content">
    <header class="page-head">
      <div>
        <h1>Student Management</h1>
        <p>View, add, edit, and delete your student records.</p>
      </div>
      <button class="btn primary" id="addBtn">+ Add Student</button>
    </header>
 
    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search by name, ID, or course" aria-label="Search students">
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option>Active</option>
          <option>Inactive</option>
          <option>Pending</option>
        </select>
      </div>
 
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Student ID</th><th>Name</th><th>Course</th><th>Year Level</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
 
      <footer class="table-foot">
        <span id="count"></span>
        <div class="pager" id="pager"></div>
      </footer>
    </section>
  </main>
 
  <dialog id="modal">
    <form id="form" method="dialog">
      <h2 id="modalTitle">Add Student</h2>
      <label>Student ID<input name="id" required placeholder="2024-0001"></label>
      <label>Full name<input name="name" required></label>
      <label>Course<input name="course" required placeholder="Computer Science"></label>
      <div class="row">
        <label>Year level
          <select name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
        </label>
        <label>Status
          <select name="status"><option>Active</option><option>Inactive</option><option>Pending</option></select>
        </label>
      </div>
      <p class="error" id="formError" hidden></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save student</button>
      </div>
    </form>
  </dialog>
 
  <script src="script.js"></script>
</body>
</html>
